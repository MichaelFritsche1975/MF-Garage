<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#1C1E1D; --panel:#242625; --panelAlt:#2B2D2C; --line:#3A3C3A; --lineSoft:#31332F;
    --text:#EDEAE2; --textDim:#A5A79E; --textFaint:#787A73;
    --accent:#E0692C; --accentDim:#7A4326;
    --blue:#5C93A8; --blueDim:#33505A;
    --green:#7DAE6E; --greenDim:#3E5236;
    --amber:#E3B23C; --amberDim:#5C4B1F;
    --red:#D2564D; --redDim:#5C2A26;
    --font-display:'Oswald','Arial Narrow',sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; min-height:100vh;}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  button, input, select{font-family:inherit;}
  button{cursor:pointer;}
  a{color:var(--accent);}
  #app{max-width:900px;margin:0 auto;}
  .root{display:grid;grid-template-columns:260px 1fr;min-height:100vh;background:var(--bg);}
  .sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;}
  .detail{overflow-y:auto;}
  .topbar{padding:16px 14px 10px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:var(--font-display);font-size:20px;letter-spacing:0.04em;text-transform:uppercase;}
  .count{padding:0 14px 10px;font-size:12px;color:var(--textFaint);}
  .cat-heading{padding:8px 14px 4px;font-size:11px;letter-spacing:0.06em;color:var(--textFaint);
    font-family:var(--font-display);text-transform:uppercase;}
  .vrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 14px;
    background:transparent;border:none;border-left:2px solid transparent;cursor:pointer;color:var(--text);}
  .vrow.active{background:var(--panelAlt);border-left-color:var(--accent);}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .vrow-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vrow-plate{font-size:11px;color:var(--textFaint);font-family:var(--font-mono);margin-top:1px;}
  .empty-note{padding:20px;color:var(--textFaint);font-size:13px;line-height:1.6;}
  .placeholder{padding:40px;color:var(--textFaint);font-size:13px;text-align:center;}
  .iconbtn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:3px;
    border:1px solid var(--line);background:transparent;color:var(--textDim);font-size:15px;flex-shrink:0;}
  .iconbtn.danger{color:var(--red);}
  .iconbtn.small{width:26px;height:26px;font-size:13px;}
  .btn-primary{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#241207;
    border:none;border-radius:3px;padding:8px 14px;font-size:13px;font-weight:600;}
  .btn-primary.small{padding:5px 10px;font-size:12px;}
  .btn-ghost{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--textDim);
    border:1px solid var(--line);border-radius:3px;padding:8px 14px;font-size:13px;}
  .btn-ghost.small{padding:5px 10px;font-size:12px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;color:var(--textFaint);}
  .field input, .field select{background:var(--panelAlt);border:1px solid var(--line);border-radius:3px;
    color:var(--text);padding:7px 9px;font-size:13px;width:100%;outline:none;}
  .field input.mono{font-family:var(--font-mono);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .section{padding:0;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .section-head .left{display:flex;align-items:center;gap:8px;color:var(--textDim);}
  .section-title{font-family:var(--font-display);font-size:15px;letter-spacing:0.03em;color:var(--text);
    text-transform:uppercase;}
  .muted{color:var(--textFaint);font-size:13px;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;
    padding:3px 8px;border-radius:3px;white-space:nowrap;}
  .plate{font-family:var(--font-mono);font-size:13px;font-weight:600;letter-spacing:0.04em;color:var(--text);
    background:var(--panelAlt);border-radius:3px;padding:3px 8px;white-space:nowrap;flex-shrink:0;}
  .detail-header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);}
  .veh-name{font-family:var(--font-display);font-size:19px;color:var(--text);text-transform:uppercase;
    letter-spacing:0.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .veh-sub{font-size:12px;color:var(--textFaint);}
  .meterbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);
    background:var(--panelAlt);flex-wrap:wrap;}
  .meterbar .val{font-family:var(--font-mono);font-size:14px;color:var(--text);}
  .link-btn{background:none;border:none;color:var(--textFaint);font-size:12px;text-decoration:underline;padding:0;}
  .body-pad{padding:20px;display:flex;flex-direction:column;gap:26px;}
  .form-box{display:flex;flex-direction:column;gap:8px;background:var(--panelAlt);border:1px solid var(--line);
    border-radius:4px;padding:10px;margin-top:10px;}
  .plan-item, .hist-item{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;
    background:var(--panelAlt);border:1px solid var(--lineSoft);border-radius:4px;}
  .plan-item + .plan-item{margin-top:8px;}
  .hist-item{flex-direction:column;align-items:stretch;gap:8px;padding:9px 0;background:transparent;
    border:none;border-bottom:1px solid var(--lineSoft);border-radius:0;}
  .hist-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .hist-date{font-family:var(--font-mono);font-size:12px;color:var(--textFaint);min-width:72px;}
  .hist-desc{font-size:13px;color:var(--text);}
  .hist-meta{font-size:11px;color:var(--textFaint);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .tag{padding:1px 6px;border-radius:2px;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;}
  .tag.wartung{background:var(--blueDim);color:var(--blue);}
  .tag.reparatur{background:var(--redDim);color:var(--red);}
  .filter-row{display:flex;gap:6px;margin-bottom:10px;}
  .filter-btn{padding:4px 10px;border-radius:3px;border:1px solid var(--lineSoft);background:transparent;
    color:var(--textFaint);font-size:11px;text-transform:capitalize;}
  .filter-btn.active{border-color:var(--textDim);background:var(--panelAlt);color:var(--text);}
  .spec-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:7px 0;
    border-bottom:1px solid var(--lineSoft);}
  .spec-label{font-size:13px;color:var(--textDim);flex-shrink:0;}
  .spec-value{font-size:13px;color:var(--text);font-family:var(--font-mono);text-align:right;}
  .photo-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .photo-thumb{position:relative;width:84px;height:84px;flex-shrink:0;}
  .photo-thumb.small{width:64px;height:64px;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;border-radius:4px;border:1px solid var(--line);
    cursor:pointer;display:block;}
  .photo-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    background:var(--redDim);color:var(--red);border:1px solid var(--bg);display:flex;align-items:center;
    justify-content:center;font-size:11px;line-height:1;}
  .lightbox{position:fixed;inset:0;background:rgba(10,10,10,0.92);display:flex;align-items:center;
    justify-content:center;z-index:1000;padding:24px;}
  .lightbox img{max-width:92%;max-height:92%;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,0.5);}
  .lightbox-close{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;
    background:var(--panel);color:var(--text);border:1px solid var(--line);display:flex;align-items:center;
    justify-content:center;font-size:16px;}
  .cat-pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .cat-pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:4px;
    border:1px solid var(--line);background:var(--panelAlt);color:var(--textDim);font-size:13px;}

  baumaschine:{label:"Baumaschine",plural:"Baumaschinen",accent:"var(--amber)",accentDim:"var(--amberDim)",defaultUnit:"h",inspectionLabel:"UVV-Prüfung",icon:"🚜"},
};

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}.${m}.${y}`; }
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function fmtNum(n){ const num = Number(n); return isNaN(num) ? esc(n) : num.toLocaleString("de-DE"); }

function catInfo(id){ return CATS[id] || CATS.auto; }
function meterInfo(v){
  const cat = catInfo(v.category);
  const unit = v.meterUnit || cat.defaultUnit;
  return { unit, label: unit==="h" ? "Betriebsstunden" : "Kilometerstand", soonThreshold: unit==="h"?10:500, inspectionLabel: cat.inspectionLabel };
}

function planItemStatus(item, currentMeter, unit, soonThreshold){
  const today = todayISO();
  let dueDays=null, dueMeter=null;
  if(item.intervalMonths && item.lastDoneDate){
    const next = new Date(item.lastDoneDate+"T00:00:00");
    next.setMonth(next.getMonth()+Number(item.intervalMonths));
    dueDays = daysBetween(today, next.toISOString().slice(0,10));
  }
  if(item.intervalMeter && item.lastDoneMeter!=="" && item.lastDoneMeter!=null && currentMeter!=="" && currentMeter!=null){
    dueMeter = (Number(item.lastDoneMeter)+Number(item.intervalMeter)) - Number(currentMeter);
  }
  let level="ok", label="";
  const parts=[];
  if(dueDays!==null) parts.push(`${dueDays<0?"überfällig seit "+Math.abs(dueDays):"noch "+dueDays} Tag${Math.abs(dueDays)===1?"":"e"}`);
  if(dueMeter!==null) parts.push(`${dueMeter<0?"überfällig seit "+Math.abs(dueMeter):"noch "+dueMeter} ${unit}`);
  if(dueDays===null && dueMeter===null){ level="unknown"; label="kein Datum hinterlegt"; }
  else {
    const overdue = (dueDays!==null && dueDays<0) || (dueMeter!==null && dueMeter<0);
    const soon = (dueDays!==null && dueDays<=30) || (dueMeter!==null && dueMeter<=soonThreshold);
    level = overdue?"danger":soon?"warn":"ok";
    label = parts.join(" / ");
  }
  return {level,label};
}
function tuvStatus(nextDate){
  if(!nextDate) return {level:"unknown", label:"kein Termin hinterlegt"};
  const d = daysBetween(todayISO(), nextDate);
  const level = d<0?"danger":d<=60?"warn":"ok";
  const label = d<0?`überfällig seit ${Math.abs(d)} Tagen`:`noch ${d} Tage`;
  return {level,label};
}
function worstLevel(levels){
  if(levels.includes("danger")) return "danger";
  if(levels.includes("warn")) return "warn";
  if(levels.includes("unknown")) return "unknown";
  return "ok";
}
function vehicleStatus(v){
  const m = meterInfo(v);
  const t = tuvStatus(v.tuvNextDate).level;
  const plans = (v.planItems||[]).map(p=>planItemStatus(p, v.currentMeter, m.unit, m.soonThreshold).level);
  return worstLevel([t, ...plans]);
}
function dotColor(l){ return l==="danger"?"var(--red)":l==="warn"?"var(--amber)":l==="ok"?"var(--green)":"var(--textFaint)"; }
function levelBg(l){ return l==="danger"?"var(--redDim)":l==="warn"?"var(--amberDim)":l==="ok"?"var(--greenDim)":"var(--lineSoft)"; }
function levelFg(l){ return l==="danger"?"var(--red)":l==="warn"?"var(--amber)":l==="ok"?"var(--green)":"var(--textFaint)"; }
function badge(level,label){
  return `<span class="badge" style="background:${levelBg(level)};color:${levelFg(level)}">
    <span class="dot" style="width:6px;height:6px;background:${dotColor(level)}"></span>${esc(label)}</span>`;
}

/* ---------- image compression ---------- */
function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1000; quality = quality || 0.72;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(reader.error);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let {width,height} = img;
        if(width>height && width>maxDim){ height=Math.round(height*maxDim/width); width=maxDim; }
        else if(height>maxDim){ width=Math.round(width*maxDim/height); height=maxDim; }
        const c = document.createElement("canvas"); c.width=width; c.height=height;
        c.getContext("2d").drawImage(img,0,0,width,height);
        resolve(c.toDataURL("image/jpeg",quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- state ---------- */
let vehicles = [];
let errorMsg = null;
const ui = {
  selectedId:null, adding:false, addStep:1, addCategory:"moto",
  editingHeader:false, meterEditing:false, tuvEditing:false,
  planAdding:false, historyAdding:false, techAdding:false, docAdding:false,
  historyFilter:"alle", lightbox:null,
};

function resetDetailUi(){
  ui.editingHeader=false; ui.meterEditing=false; ui.tuvEditing=false;
  ui.planAdding=false; ui.historyAdding=false; ui.techAdding=false; ui.docAdding=false;
  ui.historyFilter="alle"; ui.lightbox=null;
}

function load(){
  let raw = null;
  try { raw = localStorage.getItem("garage-vehicles"); } catch(e){ raw = null; }
  if(raw){
    try { vehicles = JSON.parse(raw); } catch(e){ vehicles = SEED(); }
  } else {
    vehicles = SEED();
    persistSilently();
  }
  render();
}
function persistSilently(){
  try { localStorage.setItem("garage-vehicles", JSON.stringify(vehicles)); errorMsg=null; }
  catch(e){ errorMsg = "Speichern fehlgeschlagen — der Speicher ist evtl. voll (v. a. durch Fotos). Alte Fotos ggf. löschen."; }
}
function persist(next){
  vehicles = next;
  persistSilently();
  render();
}
function findVehicle(id){ return vehicles.find(v=>v.id===id); }
function updateVehicle(id, patch){ persist(vehicles.map(v=>v.id===id?{...v,...patch}:v)); }
function addVehicleObj(v){ persist([...vehicles, v]); }
function deleteVehicleObj(id){ persist(vehicles.filter(v=>v.id!==id)); }

function val(id){ const el = document.getElementById(id); return el ? el.value : ""; }

/* ---------- render ---------- */
function render(){
  const app = document.getElementById("app");
  const selected = ui.selectedId ? findVehicle(ui.selectedId) : null;
  app.innerHTML = `
    <div class="root ${selected?"has-selection":""}">
      <div class="sidebar">${renderSidebar()}</div>
      <div class="detail">${renderDetail(selected)}</div>
    </div>
    ${errorMsg?`<div class="error-box">${esc(errorMsg)}</div>`:""}
    ${renderLightbox()}
  `;
}

function renderSidebar(){
  const grouped = {};
  CAT_ORDER.forEach(c=>grouped[c]=[]);
  vehicles.forEach(v=>{ (grouped[v.category]=grouped[v.category]||[]).push(v); });

  let html = `
    <div class="topbar">
      <span class="brand">Garage</span>
      <button class="iconbtn" data-action="add-vehicle-open" title="Fahrzeug hinzufügen">+</button>
    </div>
    <div class="count">${vehicles.length} Fahrzeug${vehicles.length===1?"":"e"}</div>
    <div class="toolbar-row" style="padding:0 14px 12px;">
      <button class="btn-ghost small" data-action="export-data" title="Alle Daten als Datei sichern">⬇ Sichern</button>
      <label class="btn-ghost small" style="cursor:pointer;" title="Aus einer zuvor gesicherten Datei laden">⬆ Laden
        <input type="file" accept="application/json" style="display:none;" data-onchange="import-data">
      </label>
    </div>
  `;

  if(ui.adding) html += renderAddVehicleForm();

  if(vehicles.length===0 && !ui.adding){
    html += `<div class="empty-note">Noch keine Fahrzeuge angelegt. Leg dein erstes Fahrzeug an, um mit Wartungsplan und Prüf-Erinnerungen zu starten.</div>`;
  }

  CAT_ORDER.forEach(id=>{
    const list = grouped[id];
    if(!list.length) return;
    const info = catInfo(id);
    html += `<div class="cat-heading">${esc(info.plural)} (${list.length})</div>`;
    list.forEach(v=>{
      const status = vehicleStatus(v);
      const active = v.id===ui.selectedId;
      html += `
        <button class="vrow ${active?"active":""}" data-action="select-vehicle" data-id="${v.id}">
          <span class="dot" style="background:${dotColor(status)}"></span>
          <div style="min-width:0;flex:1;">
            <div class="vrow-name">${esc(v.name || (v.brand+" "+v.model).trim() || "Ohne Namen")}</div>
            <div class="vrow-plate">${esc(v.plate || "kein Kennzeichen")}</div>
          </div>
        </button>`;
    });
  });
  return html;
}

  if(ui.addStep===1){

      const info = catInfo(id);

      return `<button class="cat-pick ${active?"active":""}" data-action="pick-category" data-cat="${id}">
        <span class="cat-emoji">${info.icon}</span>${esc(info.label)}

    }).join("");
    return `

      </div>
    </div>`;
}

  return `

  if(scope==="vehicle") photos = v.photos || [];
  else if(scope==="history"){ const h = (v.history||[]).find(x=>x.id===hid); photos = h ? (h.photos||[]) : []; }

  return `<div class="lightbox" data-action="close-lightbox">

/* ---------- actions ---------- */
function handleAction(action, el){
  const id = el.dataset.id;
  const v = id ? findVehicle(id) : null;

  if(action==="select-vehicle"){ resetDetailUi(); ui.selectedId = id; render(); return; }
  if(action==="back"){ resetDetailUi(); ui.selectedId = null; render(); return; }

  if(action==="export-data"){
    const stamp = todayISO();
    const filename = `garage-export-${stamp}.json`;
    const json = JSON.stringify(vehicles, null, 2);
    const blob = new Blob([json], {type:"application/json"});
    let file = null;
    try { file = new File([blob], filename, {type:"application/json"}); } catch(e){ file = null; }
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:"Garage-Sicherung"}).catch(()=>{ /* user cancelled — nothing to do */ });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    return;
  }
  if(action==="add-vehicle-open"){ ui.adding=true; ui.addStep=1; ui.addCategory="moto"; render(); return; }
  if(action==="add-vehicle-cancel"){ ui.adding=false; render(); return; }
  if(action==="pick-category"){ ui.addCategory = el.dataset.cat; render(); return; }
  if(action==="add-step2"){ ui.addStep=2; render(); return; }
  if(action==="save-new-vehicle"){
    const nv = {
      id:uid(), category:val("f-category"), meterUnit:val("f-unit"),
      name:val("f-name"), plate:val("f-plate"), brand:val("f-brand"), model:val("f-model"),
      year:val("f-year"), currentMeter:val("f-meter"), vin:val("f-vin"),
      tuvNextDate:"", techSpecs:[], planItems:[], history:[], photos:[],
    };
    ui.adding=false; ui.selectedId=nv.id;
    addVehicleObj(nv);
    return;
  }

  if(action==="edit-header-open"){ ui.editingHeader=true; render(); return; }
  if(action==="edit-header-cancel"){ ui.editingHeader=false; render(); return; }
  if(action==="save-edit-header"){
    const patch = {
      category:val("f-category"), meterUnit:val("f-unit"),
      name:val("f-name"), plate:val("f-plate"), brand:val("f-brand"), model:val("f-model"),
      year:val("f-year"), currentMeter:val("f-meter"), vin:val("f-vin"),
    };
    ui.editingHeader=false;
    updateVehicle(id, patch);
    return;
  }
  if(action==="delete-vehicle"){
    if(confirm(`${(v&&v.name)||"Fahrzeug"} wirklich löschen?`)){ ui.selectedId=null; deleteVehicleObj(id); }
    return;
  }

  if(action==="meter-edit-open"){ ui.meterEditing=true; render(); return; }
  if(action==="meter-cancel"){ ui.meterEditing=false; render(); return; }
  if(action==="meter-save"){ ui.meterEditing=false; updateVehicle(id, {currentMeter: val("meter-draft")}); return; }

  if(action==="tuv-edit-open"){ ui.tuvEditing=true; render(); return; }
  if(action==="tuv-cancel"){ ui.tuvEditing=false; render(); return; }
  if(action==="tuv-save"){ ui.tuvEditing=false; updateVehicle(id, {tuvNextDate: val("tuv-date")}); return; }

  if(action==="plan-add-open"){ ui.planAdding=true; render(); return; }
  if(action==="plan-add-cancel"){ ui.planAdding=false; render(); return; }
  if(action==="plan-add-save"){
    const label = val("p-label").trim();
    if(!label) return;
    const item = {id:uid(), label, intervalMeter:val("p-intervalMeter"), intervalMonths:val("p-intervalMonths"), lastDoneDate:val("p-lastDoneDate"), lastDoneMeter:val("p-lastDoneMeter")};
    ui.planAdding=false;
    updateVehicle(id, {planItems:[...(v.planItems||[]), item]});
    return;
  }
  if(action==="plan-remove"){
    const pid = el.dataset.pid;
    updateVehicle(id, {planItems:(v.planItems||[]).filter(p=>p.id!==pid)});
    return;
  }
  if(action==="plan-mark-done"){
    const pid = el.dataset.pid;
    updateVehicle(id, {planItems:(v.planItems||[]).map(p=>p.id===pid?{...p,lastDoneDate:todayISO(),lastDoneMeter:v.currentMeter||p.lastDoneMeter}:p)});
    return;
  }

  if(action==="history-add-open"){ ui.historyAdding=true; render(); return; }
  if(action==="history-add-cancel"){ ui.historyAdding=false; render(); return; }
  if(action==="history-add-save"){
    const desc = val("h-desc").trim();
    if(!desc) return;
    const entry = {id:uid(), date:val("h-date")||todayISO(), km:val("h-km"), type:val("h-type")||"wartung", desc, cost:val("h-cost"), photos:[]};
    ui.historyAdding=false;
    updateVehicle(id, {history:[entry, ...(v.history||[])]});
    return;
  }
  if(action==="history-remove"){
    const hid = el.dataset.hid;
    updateVehicle(id, {history:(v.history||[]).filter(h=>h.id!==hid)});
    return;
  }
  if(action==="history-filter"){ ui.historyFilter = el.dataset.filter; render(); return; }

  if(action==="tech-add-open"){ ui.techAdding=true; render(); return; }
  if(action==="tech-add-cancel"){ ui.techAdding=false; render(); return; }
  if(action==="tech-add-save"){
    const label = val("t-label").trim();
    if(!label) return;
    const spec = {id:uid(), label, value:val("t-value")};
    ui.techAdding=false;
    updateVehicle(id, {techSpecs:[...(v.techSpecs||[]), spec]});
    return;
  }
  if(action==="tech-remove"){
    const tid = el.dataset.tid;
    updateVehicle(id, {techSpecs:(v.techSpecs||[]).filter(s=>s.id!==tid)});
    return;
  }

  if(action==="doc-add-open"){ ui.docAdding=true; render(); return; }
  if(action==="doc-add-cancel"){ ui.docAdding=false; render(); return; }
  if(action==="doc-add-save"){
    const label = val("d-label").trim();
    const url = val("d-url").trim();
    if(!label || !url) return;
    const doc = {id:uid(), label, url};
    ui.docAdding=false;
    updateVehicle(id, {docs:[...(v.docs||[]), doc]});
    return;
  }
  if(action==="doc-remove"){
    const did = el.dataset.did;
    updateVehicle(id, {docs:(v.docs||[]).filter(d=>d.id!==did)});
    return;
  }

  if(action==="open-lightbox"){
    ui.lightbox = { scope: el.dataset.scope, vid: el.dataset.vid, hid: el.dataset.hid||null, idx: Number(el.dataset.idx) };
    render(); return;
  }
  if(action==="close-lightbox"){ ui.lightbox=null; render(); return; }

  if(action==="remove-vehicle-photo"){
    const vid = el.dataset.vid, idx = Number(el.dataset.idx);
    const vv = findVehicle(vid);
    updateVehicle(vid, {photos:(vv.photos||[]).filter((_,i)=>i!==idx)});
    return;
  }
  if(action==="remove-history-photo"){
    const vid = el.dataset.vid, hid = el.dataset.hid, idx = Number(el.dataset.idx);
    const vv = findVehicle(vid);
    updateVehicle(vid, {history:(vv.history||[]).map(h=>h.id===hid?{...h,photos:(h.photos||[]).filter((_,i)=>i!==idx)}:h)});
    return;
  }
}

async function handleFileChange(kind, el){
  if(kind==="import-data"){
    const file = el.files && el.files[0];
    if(!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!Array.isArray(parsed)) throw new Error("Keine gültige Sicherungsdatei.");
      if(confirm(`${parsed.length} Fahrzeuge aus der Datei laden? Der aktuelle Datenstand auf diesem Gerät wird dabei überschrieben.`)){
        resetDetailUi(); ui.selectedId=null; ui.adding=false;
        persist(parsed);
      }
    } catch(e){
      alert("Die Datei konnte nicht gelesen werden. Bitte eine mit „Sichern” erzeugte Datei verwenden.");
    }
    el.value = "";
    return;
  }

  const files = el.files;
  if(!files || !files.length) return;
  let compressed;
  try { compressed = await Promise.all(Array.from(files).map(f=>compressImage(f))); }
  catch(e){ return; }

  if(kind==="vehicle-photo-upload"){
    const vid = el.dataset.id;
    const vv = findVehicle(vid);
    updateVehicle(vid, {photos:[...(vv.photos||[]), ...compressed]});
  } else if(kind==="history-photo-upload"){
    const vid = el.dataset.vid, hid = el.dataset.hid;
    const vv = findVehicle(vid);
    updateVehicle(vid, {history:(vv.history||[]).map(h=>h.id===hid?{...h,photos:[...(h.photos||[]),...compressed]}:h)});
  }
}

document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  handleAction(el.dataset.action, el);
});
document.addEventListener("change", (e)=>{
  const el = e.target.closest("[data-onchange]");
  if(!el) return;
  handleFileChange(el.dataset.onchange, el);
});

load();
</script>
